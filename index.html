<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock-paper-scissor.css">
</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-btn"><image class="move-icon" src="images/rock-emoji.png"></button>
    <button class="move-button js-paper-btn"><img class="move-icon" src="images/paper-emoji.png"></button>
    <button class="move-button js-scissors-btn"><img class="move-icon" src="images/scissors-emoji.png"></button>
    <p class="js-result result"></p>
    <p class="js-moves">
        
    </p>
    <p class="js-score score">

    </p>
    <button class="reset-button js-reset-btn">Reset Score</button>
    <button class="auto-play-button">Auto Play</button>

    <div class="js-warn">
        
    </div>


    <script src="rock-paper-scissor.js"></script>
</body>
</html>
